[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CLI-Music-Downloader"
version = "2.1.0"
description = "Download music (or a whole Apple Music song list PDF) as Artist/Title.mp3 with metadata, artwork and lyrics"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Jordan Lang", email = "jordolang@example.com"}
]
maintainers = [
    {name = "Jordan Lang", email = "jordolang@example.com"}
]
keywords = [
    "music", 
    "downloader", 
    "youtube", 
    "metadata", 
    "album-art", 
    "mp3", 
    "lyrics", 
    "cli", 
    "musicbrainz",
    "shazam"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
    "Environment :: Console"
]
requires-python = ">=3.9"
dependencies = [
    # Audio search + download (YouTube Music, YouTube, SoundCloud) — needs ffmpeg on PATH
    "yt-dlp>=2025.1.1",
    # ID3 tags, album artwork and lyrics embedding
    "mutagen>=1.45.0",
    # Catalog (iTunes / Deezer), lyrics (LRCLIB) and Audius requests
    "requests>=2.25.0",
    # Song list PDF parsing
    "pymupdf>=1.24.0",
    # Artwork cropping/resizing
    "Pillow>=8.0.0",
    # Terminal UI for the music suggester
    "textual>=0.80.0",
    # Native desktop window for the music app (WKWebView on macOS)
    "pywebview>=5.0",
]

[project.optional-dependencies]
# Dependencies of the older metadata tools (batch / fix-art commands)
legacy = [
    "eyed3>=0.9.0",
    "lyricsgenius>=3.0.0",
    "shazamio>=0.3.0",
    "musicbrainzngs>=0.7.0",
    "pylast>=5.0.0",
    "discogs-client>=2.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=0.8.0",
]
dev = [
    # Testing framework
    "pytest>=6.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    
    # Development tools
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.991",
    
    # Build tools
    "build>=0.8.0",
    "twine>=4.0.0"
]
docs = [
    # Documentation generation
    "mkdocs>=1.4.0",
    "mkdocs-material>=8.0.0",
    "mkdocs-awesome-pages-plugin>=2.8.0"
]
audio-fingerprinting = [
    # Advanced audio fingerprinting
    "acrcloud>=1.4.0"
]
all = [
    "CLI-Music-Downloader[legacy,dev,docs,audio-fingerprinting]"
]

[project.urls]
Homepage = "https://github.com/jordolang/CLI-Music-Downloader"
Repository = "https://github.com/jordolang/CLI-Music-Downloader.git"
Documentation = "https://github.com/jordolang/CLI-Music-Downloader#readme"
"Bug Tracker" = "https://github.com/jordolang/CLI-Music-Downloader/issues"
Changelog = "https://github.com/jordolang/CLI-Music-Downloader/releases"

[project.scripts]
cli-music-downloader = "cli_music_downloader.cli:cli_main"
download-songlist = "cli_music_downloader.cli:download_songlist"
download-music = "cli_music_downloader.cli:download_music"
music-suggester = "cli_music_downloader.cli:music_suggester"
music-player = "cli_music_downloader.cli:music_player"
batch-metadata = "cli_music_downloader.cli:batch_metadata"
fixalbumart-improved = "cli_music_downloader.cli:fixalbumart_improved"

[tool.setuptools]
packages = ["cli_music_downloader", "cli_music_downloader.gui"]

[tool.setuptools.package-data]
cli_music_downloader = ["*.py", "gui/static/*"]

# Development and testing configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "yt_dlp.*",
    "pymupdf.*",
    "eyed3.*",
    "mutagen.*",
    "lyricsgenius.*",
    "shazamio.*",
    "musicbrainzngs.*",
    "acrcloud.*",
    "pylast.*",
    "discogs_client.*"
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cli_music_downloader"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
