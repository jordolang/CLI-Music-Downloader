name: Desktop release

# Builds the Windows and macOS desktop apps and publishes them on a GitHub release.
# Push a tag like v2.1.0 to release, or run it by hand to just build the artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            arch: x86_64
          - os: macos-latest
            label: macos-arm64
            arch: arm64
          - os: macos-15-intel
            label: macos-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "Building version $v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "yt-dlp[default]" pyinstaller

      - name: Download ffmpeg and deno
        run: python packaging/fetch_tools.py --arch ${{ matrix.arch }}

      - name: Build app
        run: pyinstaller packaging/cli_music.spec --noconfirm --distpath dist-app --workpath build-app

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "dist-app/CLI Music/cli-music-downloader.exe" --version
          "dist-app/CLI Music/_internal/tools/ffmpeg.exe" -version | head -1
          "dist-app/CLI Music/_internal/tools/deno.exe" --version | head -1

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist-app/CLI Music.app/Contents/MacOS/CLI Music" --version
          "dist-app/CLI Music.app/Contents/Frameworks/tools/ffmpeg" -version | head -1
          "dist-app/CLI Music.app/Contents/Frameworks/tools/deno" --version | head -1

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packaging/README-desktop.txt "dist-app/CLI Music/README.txt"
          Compress-Archive -Path "dist-app/CLI Music" -DestinationPath "CLI-Music-$env:APP_VERSION-${{ matrix.label }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "dist-app/CLI Music.app"
          mkdir dmg && cp -R "dist-app/CLI Music.app" dmg/ && ln -s /Applications dmg/Applications
          cp packaging/README-desktop.txt dmg/README.txt
          hdiutil create -volname "CLI Music" -srcfolder dmg -format UDZO -ov "CLI-Music-${APP_VERSION}-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            CLI-Music-*.zip
            CLI-Music-*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          (cd assets && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "CLI Music $GITHUB_REF_NAME" \
            --notes-file packaging/RELEASE_NOTES.md
