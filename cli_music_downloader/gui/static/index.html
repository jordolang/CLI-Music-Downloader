<div id="app">
  <aside id="sidebar">
    <div class="brand"><svg class="ic"><use href="#i-note"/></svg><span>CLI Music</span></div>
    <label class="search-box">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search songs, artists, videos" autocomplete="off" spellcheck="false">
    </label>
    <nav id="nav"></nav>
  </aside>

  <main id="main" tabindex="-1"></main>

  <aside id="drawer" hidden>
    <div class="drawer-tabs">
      <button data-drawer="queue">Up Next</button>
      <button data-drawer="lyrics">Lyrics</button>
      <button class="icon-btn" id="drawer-close" title="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div id="drawer-body"></div>
  </aside>

  <footer id="player">
    <div class="np">
      <div class="np-art" id="np-art"></div>
      <div class="np-text">
        <div class="np-title" id="np-title">Not playing</div>
        <div class="np-sub" id="np-sub">Pick a song from your library, or search to preview anything</div>
      </div>
      <button class="icon-btn np-love" id="np-love" title="Love" hidden><svg class="ic"><use href="#i-heart"/></svg></button>
    </div>
    <div class="transport">
      <div class="buttons">
        <button class="icon-btn small" id="btn-shuffle" title="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" id="btn-prev" title="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="play-btn" id="btn-play" title="Play"><svg class="ic"><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="btn-next" title="Next"><svg class="ic"><use href="#i-next"/></svg></button>
        <button class="icon-btn small" id="btn-repeat" title="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="scrub">
        <span id="t-cur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <span id="t-dur">0:00</span>
      </div>
    </div>
    <div class="extras">
      <span class="pill" id="preview-pill" hidden>Preview</span>
      <button class="icon-btn small" id="btn-lyrics" title="Lyrics"><svg class="ic"><use href="#i-lyrics"/></svg></button>
      <button class="icon-btn small" id="btn-queue" title="Up Next"><svg class="ic"><use href="#i-queue"/></svg></button>
      <button class="icon-btn small" id="btn-mute" title="Mute"><svg class="ic"><use href="#i-volume"/></svg></button>
      <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </footer>
</div>

<div id="menu" class="menu" hidden></div>
<div id="toasts"></div>
<div id="modal-root"></div>
<audio id="audio" preload="auto"></audio>
<input type="file" id="list-file" accept=".pdf,.csv,.txt" hidden>
<script src="/app.js"></script>
</body>
</html>
